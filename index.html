<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>メニュー作成</title>
<style>
:root{--red:#b3261e;--ink:#1a1a1a;--line:#ddd}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f3f1ec;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
button,input,select{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
/* ---- アプリ画面 ---- */
header{position:sticky;top:0;z-index:10;background:#141414;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:600;letter-spacing:.1em;margin-right:auto}
.seg{display:flex;border:1px solid #666;border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:#ccc;padding:7px 14px}
body.edit .seg .e,body.preview .seg .p{background:var(--red);color:#fff}
.print{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600}
main{max-width:640px;margin:0 auto;padding:10px 10px 80px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;border:1px solid #bbb;background:#fff;border-radius:20px;padding:7px 14px;white-space:nowrap}
.tabs button.on{background:#141414;color:#fff;border-color:#141414}
.tabs button.add{border-style:dashed;color:#b3261e;border-color:#b3261e}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.box label{display:block;font-size:12px;color:#777;margin:8px 0 3px}
.box label:first-child{margin-top:0}
.box input,.box select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
.it{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fcfbf8}
.it .row2{display:grid;grid-template-columns:1fr 96px;gap:8px;margin-bottom:8px}
.it input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
.it .p{text-align:right;color:var(--red);font-weight:600}
.ops{display:flex;gap:6px;margin-top:8px}
.ops button{flex:1;border:1px solid #ccc;background:#fff;border-radius:8px;padding:7px 0;font-size:14px}
.ops .del{color:var(--red);border-color:#e3b5b1}
.addbtn{width:100%;border:2px dashed var(--red);color:var(--red);background:#fff;border-radius:10px;padding:12px;font-weight:600}
.sub-actions{display:flex;flex-wrap:wrap;gap:8px}
.sub-actions button{border:1px solid #bbb;background:#fff;border-radius:8px;padding:8px 12px;font-size:14px}
.sub-actions .danger{color:var(--red);border-color:#e3b5b1}
.hint{font-size:12px;color:#777;line-height:1.6;margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141414;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
#toast.on{opacity:.92}

/* ---- プレビュー／印刷ページ（A4 = 794x1122px） ---- */
#pv{position:relative;overflow:hidden;margin:0 auto}
body.edit #pv{position:absolute;left:-10000px;top:0;width:794px}
body.edit main.pvmain{display:none}
body.preview #app-edit{display:none}
body.preview main.pvmain{display:block;max-width:none;padding:12px 0 80px}
#sheet{width:794px;transform-origin:top left}
.pg{position:relative;width:794px;height:1122px;background:#fff;overflow:hidden;padding:84px 84px 0;--fs:30px;margin-bottom:24px;color:#1a1a1a;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;box-shadow:0 2px 12px #0003}
.pg .bg{position:absolute;mix-blend-mode:multiply}
.pg h1{text-align:center;font-weight:400;font-size:54px;letter-spacing:.5em;padding-left:.5em}
.pg .sub{text-align:center;font-size:20px;letter-spacing:.35em;color:#777;margin:8px 0 54px;min-height:24px}
.pg .list{position:relative;z-index:1}
.pg .row{display:flex;justify-content:space-between;gap:24px;padding:calc(var(--fs)*.27) 0;font-size:var(--fs);line-height:1.35}
.pg .row small{display:block;font-size:calc(var(--fs)*.55);color:#666}
.pg .row em{font-style:normal;color:var(--red);white-space:nowrap}
.pg .foot{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-size:20px;color:#777}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  header,#app-edit,#toast{display:none!important}
  main.pvmain{display:block!important;padding:0!important;max-width:none!important}
  #pv,body.edit #pv{position:static!important;width:auto!important;height:auto!important;overflow:visible!important;left:auto!important}
  #sheet{transform:none!important}
  .pg{margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body class="edit">
<header>
  <h1>メニュー作成</h1>
  <div class="seg"><button class="e" id="vEdit">編集</button><button class="p" id="vPrev">プレビュー</button></div>
  <button class="print" id="btnPrint">A4で印刷／PDF</button>
</header>

<main id="app-edit">
  <div class="tabs" id="tabs"></div>
  <div id="panel"></div>
  <div class="box">
    <div class="sub-actions">
      <button id="bExport">バックアップを保存</button>
      <button id="bImport">バックアップを読み込む</button>
      <button id="bReset" class="danger">最初の状態に戻す</button>
    </div>
    <p class="hint">入力した内容はこの端末のブラウザに自動で保存されます。端末を変える・ブラウザのデータを消す場合は、先に「バックアップを保存」をしてください。</p>
    <input type="file" id="fImport" accept=".json,application/json" hidden>
  </div>
</main>

<main class="pvmain" style="display:none">
  <div id="pv"><div id="sheet"></div></div>
</main>
<div id="toast"></div>

  $('#tabs').innerHTML=S.map((c,i)=>`<button data-t="${i}" class="${i===cur?'on':''}">${esc(c.title||'（無題）')}</button>`).join('')+'<button class="add" data-t="add">＋ ジャンル追加</button>';
  const c=S[cur];
  const names=Object.assign({},IMG_NAMES);if(c.custom)names.custom='アップロードした画像';const opts=Object.keys(names).map(k=>`<option value="${k}" ${c.img===k?'selected':''}>${names[k]}</option>`).join('');
  $('#panel').innerHTML=`
  <div class="box">
    <label>ジャンル名（ページの見出し）</label><input data-cf="title" value="${esc(c.title)}">
    <label>サブタイトル（英字など・空欄可）</label><input data-cf="sub" value="${esc(c.sub)}">
    <label>うすい挿絵</label><select data-cf="img">${opts}</select>
    <div class="sub-actions" style="margin-top:8px"><button data-a="upload">自分の画像を追加（選ぶ／撮影）</button><button data-a="rmimg" class="danger">挿絵を消す</button></div>
    <input type="file" id="fImg" accept="image/*" hidden>
    <label>挿絵の大きさ</label><input type="range" data-cf="size" min="200" max="800" step="10" value="${+c.size||640}">
    <label>挿絵の濃さ（左：うすい　右：こい）</label><input type="range" data-cf="op" min="5" max="80" step="1" value="${c.op==null||c.op===''?28:+c.op}">
    <label>挿絵の位置</label><select data-cf="pos"><option value="right" ${(c.pos||'right')==='right'?'selected':''}>右よせ</option><option value="center" ${c.pos==='center'?'selected':''}>中央</option><option value="left" ${c.pos==='left'?'selected':''}>左よせ</option></select>
    <p class="hint">挿絵は「白い背景に線画」の画像がきれいに重なります（写真だと暗くなります）。</p>
    <label>ページ下の注意書き（空欄可）</label><input data-cf="note" value="${esc(c.note)}">
  </div>
  <div id="items">${c.items.map((x,k)=>itemHTML(x,k)).join('')}</div>
  <button class="addbtn" data-a="add">＋ メニューを追加</button>
  <div class="box" style="margin-top:12px"><div class="sub-actions">
    <button data-a="left">← ジャンルを前へ</button><button data-a="right">ジャンルを後ろへ →</button>
    <button data-a="delcat" class="danger">このジャンルを削除</button></div></div>`;
}
function itemHTML(x,k){return `<div class="it" data-k="${k}">
  <div class="row2"><input data-f="n" placeholder="メニュー名" value="${esc(x.n)}"><input class="p" data-f="p" inputmode="numeric" placeholder="金額" value="${esc(x.p)}"></div>
  <input data-f="m" placeholder="補足メモ（任意）" value="${esc(x.m)}">
  <div class="ops"><button data-a="up">↑ 上へ</button><button data-a="down">↓ 下へ</button><button data-a="del" class="del">削除</button></div></div>`}

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t==='add'){S.push({id:uid(),title:'新しいジャンル',sub:'',img:'none',note:'',items:[it('','','')]});cur=S.length-1;save();renderEdit();return}
  cur=+b.dataset.t;renderEdit()});
$('#panel').addEventListener('input',e=>{const t=e.target,c=S[cur];
  if(t.dataset.cf){c[t.dataset.cf]=t.type==='range'?+t.value:t.value;if(t.dataset.cf==='title'){const b=$('#tabs .on');if(b)b.textContent=t.value||'（無題）'}save();return}
  const row=t.closest('.it');if(row&&t.dataset.f){c.items[+row.dataset.k][t.dataset.f]=t.value;save()}});
$('#panel').addEventListener('change',e=>{const f=e.target.dataset.cf;if(f==='img'||f==='pos'){S[cur][f]=e.target.value;save()}
  if(e.target.id==='fImg'&&e.target.files[0]){const file=e.target.files[0];e.target.value='';readImage(file)}});
function readImage(file){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);
  const c=S[cur];c.custom=cv.toDataURL('image/jpeg',.78);c.img='custom';
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){toast('画像が大きすぎて保存できませんでした');c.custom='';c.img='none'}
  save();renderEdit();toast('挿絵を追加しました')};im.onerror=()=>toast('この画像は読み込めません');im.src=r.result};r.readAsDataURL(file)}
$('#panel').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const c=S[cur],a=b.dataset.a;
  const row=b.closest('.it'),k=row?+row.dataset.k:-1;
  if(a==='upload'){$('#fImg').click();return}
  if(a==='rmimg'){c.img='none';save();renderEdit();return}
  if(a==='add'){c.items.push(it('','',''));save();renderEdit();const ins=document.querySelectorAll('.it [data-f=n]');ins[ins.length-1].focus();return}
  if(a==='del'){const nm=c.items[k].n||'（空欄）';if(confirm('「'+nm+'」を削除しますか？')){c.items.splice(k,1);save();renderEdit()}return}
  if(a==='up'&&k>0){[c.items[k-1],c.items[k]]=[c.items[k],c.items[k-1]];save();renderEdit();return}
  if(a==='down'&&k<c.items.length-1){[c.items[k+1],c.items[k]]=[c.items[k],c.items[k+1]];save();renderEdit();return}
  if(a==='left'&&cur>0){[S[cur-1],S[cur]]=[S[cur],S[cur-1]];cur--;save();renderEdit();return}
  if(a==='right'&&cur<S.length-1){[S[cur+1],S[cur]]=[S[cur],S[cur+1]];cur++;save();renderEdit();return}
  if(a==='delcat'){if(S.length<2){toast('最後の1ジャンルは削除できません');return}
    if(confirm('ジャンル「'+c.title+'」とその中のメニューをすべて削除しますか？')){S.splice(cur,1);cur=Math.max(0,cur-1);save();renderEdit()}}});

/* ---- プレビュー／印刷 ---- */
const fmt=p=>{p=String(p==null?'':p).trim();return /^[\d,]+$/.test(p)?Number(p.replace(/,/g,'')).toLocaleString('en-US'):p};
function imgSrc(c){return c.img==='custom'?(c.custom||''):(IMG[c.img]||'')}
function bgHTML(c){const src=imgSrc(c);if(!src)return '';const h=Math.min(900,Math.max(150,+c.size||640)),op=Math.min(100,Math.max(3,c.op==null||c.op===''?28:+c.op))/100,pos=c.pos||'right';
  const top=Math.max(250,1010-h);const x=pos==='left'?'left:95px':pos==='center'?'left:50%;transform:translateX(-50%)':'right:95px';
  return `<img class="bg" src="${src}" alt="" style="height:${h}px;top:${top}px;opacity:${op};${x}">`}
function renderSheet(){
  $('#sheet').innerHTML=S.map(c=>`<section class="pg">${bgHTML(c)}<h1>${esc(c.title)}</h1><div class="sub">${esc(c.sub)}</div><div class="list">${c.items.filter(x=>x.n.trim()).map(x=>`<div class="row"><span>${esc(x.n)}${x.m.trim()?`<small>${esc(x.m)}</small>`:''}</span><em>${esc(fmt(x.p))}</em></div>`).join('')}</div><div class="foot">${esc(c.note)}</div></section>`).join('');
  fit();scalePv();
}
function fit(){document.querySelectorAll('.pg').forEach(pg=>{const L=pg.querySelector('.list');let fs=30;pg.style.setProperty('--fs',fs+'px');
  while(fs>12&&L.offsetTop+L.scrollHeight>1122-110){fs--;pg.style.setProperty('--fs',fs+'px')}})}
function scalePv(){const sh=$('#sheet'),pv=$('#pv');
  if(document.body.classList.contains('preview')){const w=Math.min(innerWidth-20,794),s=w/794;sh.style.transform='scale('+s+')';pv.style.width=w+'px';pv.style.height=(sh.offsetHeight*s)+'px'}
  else{sh.style.transform='none';pv.style.width='';pv.style.height=''}}
function setView(v){document.body.className=v;document.querySelector('main.pvmain').style.display=v==='preview'?'block':'none';
  if(v==='edit')renderEdit();renderSheet();scrollTo(0,0)}
$('#vEdit').onclick=()=>setView('edit');$('#vPrev').onclick=()=>setView('preview');
$('#btnPrint').onclick=()=>{setView('preview');toast('印刷画面で「PDFに保存」を選ぶとPDFになります');setTimeout(()=>window.print(),500)};
addEventListener('resize',scalePv);
addEventListener('beforeprint',()=>{renderSheet()});

/* ---- バックアップ ---- */
$('#bExport').onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='menu-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('#bImport').onclick=()=>$('#fImport').click();
$('#fImport').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d)||!d.length||!d.every(c=>c&&Array.isArray(c.items)))throw 0;
  if(confirm('今の内容をバックアップの内容に置き換えますか？')){S=d;cur=0;save();renderEdit();toast('読み込みました')}}catch(x){toast('読み込めないファイルです')}};r.readAsText(f);e.target.value=''};
$('#bReset').onclick=()=>{if(confirm('すべてのメニューを最初のサンプルの状態に戻します。よろしいですか？（先にバックアップ推奨）')){S=defaults();cur=0;save();renderEdit();toast('最初の状態に戻しました')}};

setView('edit');
</script>
</body>
</html>
